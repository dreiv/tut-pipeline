name: Build and Deploy 🚀

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies 🔧
        run: npm ci

      - name: Lint & Type Check ✅
        run: npm run check

      - name: Build App 🏗️
        run: npm run build-only

      - name: Bundle Size Check ⚖️
        run: npm run size

      - name: Lighthouse Performance Audit ⚡
        run: npm run lhci

      - name: Upload Artifacts 📤
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to Pages 🚀
        uses: actions/deploy-pages@v4
